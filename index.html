<!-- রুটিন এন্ট্রি ফর্ম -->
<div class="card no-print" style="background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem;">
  <h3 style="color: #fff; font-size: 1.1rem; margin-bottom: 1rem;">📅 উইকলি রুটিন সেট করুন</h3>
  <form onsubmit="handleRoutineSubmit(event)">
    <div class="form-grid">
      <!-- দিন নির্বাচন -->
      <div>
        <label>দিন (Day)</label>
        <select id="routine-day" required>
          <option value="Monday">সোমবার (Monday)</option>
          <option value="Tuesday">মঙ্গলবার (Tuesday)</option>
          <option value="Wednesday">বুধবার (Wednesday)</option>
          <option value="Thursday">বৃহস্পতিবার (Thursday)</option>
          <option value="Friday">শুক্রবার (Friday)</option>
          <option value="Saturday">শনিবার (Saturday)</option>
          <option value="Sunday">রবিবার (Sunday)</option>
        </select>
      </div>

      <!-- সময় নির্বাচন (টাইম স্লট ড্রপডাউন) -->
      <div>
        <label>টাইম স্লট (Time Slot)</label>
        <select id="routine-time-select" onchange="toggleCustomTimeField()" required>
          <option value="06:00 AM - 07:30 AM">06:00 AM - 07:30 AM (Physical / PT)</option>
          <option value="08:00 AM - 10:00 AM">08:00 AM - 10:00 AM</option>
          <option value="10:30 AM - 12:30 PM">10:30 AM - 12:30 PM</option>
          <option value="01:30 PM - 03:30 PM">01:30 PM - 03:30 PM</option>
          <option value="04:00 PM - 06:00 PM">04:00 PM - 06:00 PM</option>
          <option value="06:30 PM - 08:30 PM">06:30 PM - 08:30 PM</option>
          <option value="Custom">➕ নিজের মতো সময় লিখুন (Custom Time)</option>
        </select>
      </div>

      <!-- কাস্টম সময় লেখার ফিল্ড (প্রয়োজনে সক্রিয় হবে) -->
      <div id="custom-time-box" style="display: none;">
        <label>কাস্টম সময় (যেমন: 07:00 AM - 09:00 AM)</label>
        <input type="text" id="routine-custom-time" placeholder="HH:MM AM/PM - HH:MM AM/PM">
      </div>

      <!-- বিষয় বা অ্যাক্টিভিটি -->
      <div>
        <label>বিষয় / অ্যাক্টিভিটি (Subject / Activity)</label>
        <input type="text" id="routine-activity" placeholder="যেমন: Mathematics / GK / Drill" required>
      </div>

      <!-- ব্যাচ নির্বাচন -->
      <div>
        <label>ব্যাচ / সেকশন</label>
        <select id="routine-batch" required>
          <option value="All Batches">All Batches</option>
          <option value="General">General</option>
          <option value="Hostel">Hostel</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn-submit" style="margin-top: 0.75rem;">রুটিনে যোগ করুন</button>
  </form>
</div>
